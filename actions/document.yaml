ref: elasticsearch.document
label: Document operations
description: Get, create/index, update, delete, or bulk-write documents with concurrency and size controls
enabled: true
runner_type: python
entry_point: elasticsearch.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
timeout: 120
parameters:
  endpoint:
    type: string
    required: true
  credential_key_ref:
    type: string
    required: true
  timeout_seconds:
    type: integer
    default: 30
    minimum: 1
    maximum: 300
  operation:
    type: string
    required: true
    enum: [get, index, update, delete, bulk]
  index:
    type: string
    required: true
  document_id:
    type: string
  document:
    type: object
  operations:
    type: array
  create_only:
    type: boolean
    default: true
  doc_as_upsert:
    type: boolean
    default: false
  if_seq_no:
    type: integer
  if_primary_term:
    type: integer
  confirm:
    type: string
output:
  ok:
    type: boolean
  operation:
    type: string
  status:
    type: integer
  data:
    type: object
tags: [elasticsearch, document]
