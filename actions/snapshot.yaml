ref: elasticsearch.snapshot
label: Snapshot operations
description: List repositories and safely list, create, inspect, restore, or delete snapshots
enabled: true
runner_type: python
entry_point: elasticsearch.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
timeout: 300
parameters:
  endpoint:
    type: string
    required: true
  credential_key_ref:
    type: string
    required: true
  timeout_seconds:
    type: integer
    default: 60
    minimum: 1
    maximum: 300
  operation:
    type: string
    required: true
    enum: [repositories, list, create, status, restore, delete]
  repository:
    type: string
  snapshot:
    type: string
  indices:
    type: array
  metadata:
    type: object
  rename_prefix:
    type: string
  confirm:
    type: string
output:
  ok:
    type: boolean
  operation:
    type: string
  status:
    type: integer
  data:
    type: object
tags: [elasticsearch, snapshot, backup]
