ref: elasticsearch
label: Elasticsearch
description: Safe, curated Elasticsearch 8 and 9 REST operations
version: 1.0.0
author: Attune Community
email: community@attune.io
enabled: true
system: false
tags:
  - elasticsearch
  - search
  - operations
runtime_deps:
  - python3
meta:
  category: data
  keywords:
    - elasticsearch
    - ilm
    - snapshots
  source_url: https://github.com/StackStorm-Exchange/stackstorm-elasticsearch
  source_version: v2.0.1
  source_revision: 9aba2b68da26ec356b6c533d902e560ff76c4980
  source_license: Apache-2.0
  compatibility:
    - Elasticsearch 8
    - Elasticsearch 9
testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_elasticsearch.py
      timeout: 60
      result_format: simple
  result_format: simple
  min_pass_rate: 1.0
  on_failure: block
